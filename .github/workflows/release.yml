name: Release

on:
  pull_request:
    types: [closed]
    branches:
      - main

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    # マージされたPRのみ実行
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest

    permissions:
      contents: write # リリース作成とコミット権限
      pull-requests: read # PRラベル読み取り

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          ref: ${{ github.event.pull_request.merge_commit_sha }}
          fetch-depth: 0 # 全履歴を取得（タグ確認用）

      - name: Check for release label
        id: check-label
        env:
          PR_LABELS: ${{ toJson(github.event.pull_request.labels.*.name) }}
        run: |
          release_labels=$(jq -c '[.[] | select(. == "release:major" or . == "release:minor" or . == "release:patch")]' <<< "$PR_LABELS")
          count=$(jq 'length' <<< "$release_labels")
          if [ "$count" -gt 1 ]; then
            echo "::error::Set exactly one release label."
            exit 1
          fi
          release_type=$(jq -r 'if length == 0 then "none" else .[0] | sub("^release:"; "") end' <<< "$release_labels")
          echo "release-type=$release_type" >> "$GITHUB_OUTPUT"

      - name: Setup Node.js
        if: steps.check-label.outputs.release-type != 'none'
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Get latest version from tags
        if: steps.check-label.outputs.release-type != 'none'
        id: get-version
        run: |
          latest_tag=$(git describe --tags --abbrev=0 --match 'v[0-9]*')
          if [[ ! "$latest_tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Invalid release tag: $latest_tag"
            exit 1
          fi
          current_version=${latest_tag#v}
          echo "current-version=$current_version" >> $GITHUB_OUTPUT
          echo "Current version from tags: $current_version"

      - name: Calculate new version
        if: steps.check-label.outputs.release-type != 'none'
        id: bump
        run: |
          # 現在のバージョンから新しいバージョンを計算
          current_version="${{ steps.get-version.outputs.current-version }}"
          release_type="${{ steps.check-label.outputs.release-type }}"

          IFS='.' read -r major minor patch <<< "$current_version"

          case "$release_type" in
            major)
              new_version="$((major + 1)).0.0"
              ;;
            minor)
              new_version="$major.$((minor + 1)).0"
              ;;
            patch)
              new_version="$major.$minor.$((patch + 1))"
              ;;
          esac

          echo "version=$new_version" >> $GITHUB_OUTPUT
          echo "New version: $current_version → $new_version"

      - name: Install dependencies
        if: steps.check-label.outputs.release-type != 'none'
        run: npm ci

      - name: Update package versions
        if: steps.check-label.outputs.release-type != 'none'
        run: |
          npm version ${{ steps.bump.outputs.version }} --no-git-tag-version

      - name: Verify extension
        if: steps.check-label.outputs.release-type != 'none'
        run: |
          npm run type-check
          npm run lint
          npm test

      - name: Build extension
        if: steps.check-label.outputs.release-type != 'none'
        run: |
          npm run build
          node evaluation/scripts/check-cmap-artifacts.mjs

      - name: Create distribution zip
        if: steps.check-label.outputs.release-type != 'none'
        run: |
          cp LICENSE dist/LICENSE
          cd dist
          zip -r ../tdnet-digest-v${{ steps.bump.outputs.version }}.zip .
          cd ..
          echo "Created: tdnet-digest-v${{ steps.bump.outputs.version }}.zip"

      - name: Commit and tag verified version
        if: steps.check-label.outputs.release-type != 'none'
        id: release-commit
        env:
          RELEASE_VERSION: ${{ steps.bump.outputs.version }}
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add package.json package-lock.json
          git commit -m "chore: bump version to $RELEASE_VERSION"
          git tag "v$RELEASE_VERSION"
          git push --atomic origin HEAD:main "refs/tags/v$RELEASE_VERSION"
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        if: steps.check-label.outputs.release-type != 'none'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.bump.outputs.version }}
          target_commitish: ${{ steps.release-commit.outputs.sha }}
          name: Release v${{ steps.bump.outputs.version }}
          body: |
            ## 📦 インストール方法

            1. 下部の **Assets** から `tdnet-digest-v${{ steps.bump.outputs.version }}.zip` をダウンロード
            2. 任意の場所に解凍
            3. Chrome で `chrome://extensions/` を開く
            4. 右上の「**デベロッパーモード**」を **ON** にする
            5. 「**パッケージ化されていない拡張機能を読み込む**」をクリック
            6. 解凍したフォルダを選択

            更新する場合は、既存の読み込み先フォルダを新しいZIPの内容に差し替え、拡張機能とTDnetページを再読み込みしてください。

            ⚠️ **注意**: 開発者モードでインストールするため、Chrome起動時に警告が表示されますが、正常な動作です。

            ---

            ## ✨ 変更内容

            ${{ github.event.pull_request.title }}

            ${{ github.event.pull_request.body }}

            ---

            **Full Changelog**: https://github.com/${{ github.repository }}/compare/v${{ steps.get-version.outputs.current-version }}...v${{ steps.bump.outputs.version }}
          files: tdnet-digest-v${{ steps.bump.outputs.version }}.zip
          fail_on_unmatched_files: true
          draft: false
          prerelease: false
